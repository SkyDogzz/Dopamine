name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "native/**"
      - "game/**"
      - "tools/build_windows.ps1"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "godot-windows.zip"
          $destination = Join-Path $env:RUNNER_TEMP "godot-windows"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination
          $godotConsole = Join-Path $destination "Godot_v4.7.2-stable_win64_console.exe"
          if (-not (Test-Path -LiteralPath $godotConsole -PathType Leaf)) {
            throw "Godot console executable was not found in the official Windows archive: $godotConsole"
          }
          "GODOT_EXE=$godotConsole" >> $env:GITHUB_ENV

          $templatesArchive = Join-Path $env:RUNNER_TEMP "godot-templates.tpz"
          $templatesExtracted = Join-Path $env:RUNNER_TEMP "godot-templates"
          $templatesInstalled = Join-Path $env:APPDATA "Godot/export_templates/4.7.2.stable"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -OutFile $templatesArchive
          Expand-Archive -Path $templatesArchive -DestinationPath $templatesExtracted
          New-Item -ItemType Directory -Force -Path $templatesInstalled | Out-Null
          Copy-Item -Path (Join-Path $templatesExtracted "templates/*") -Destination $templatesInstalled -Recurse -Force

      - name: Build, import and verify the Windows GDExtension
        shell: pwsh
        run: |
          $quotedGodotExecutable = '"' + $env:GODOT_EXE + '"'
          .\tools\build_windows.ps1 -GodotExecutable $quotedGodotExecutable -NoLaunch -Export

      - name: Launch exported Windows game headless
        shell: pwsh
        run: |
          $exportDirectory = (Resolve-Path -LiteralPath "build/windows/export").Path
          $packageArchive = Join-Path $env:RUNNER_TEMP "dopamine-windows-export.zip"
          $extractedDirectory = Join-Path $env:RUNNER_TEMP "dopamine-windows-extracted"
          Compress-Archive -Path (Join-Path $exportDirectory "*") -DestinationPath $packageArchive
          Expand-Archive -Path $packageArchive -DestinationPath $extractedDirectory
          $exportedGame = Join-Path $extractedDirectory "DopamineSurvivor.exe"
          $extension = Join-Path $extractedDirectory "libdopamine.windows.template_release.x86_64.dll"
          if (-not (Test-Path -LiteralPath $exportedGame -PathType Leaf) -or
              -not (Test-Path -LiteralPath $extension -PathType Leaf)) {
            throw "Extracted Windows export is missing its executable or Release GDExtension"
          }
          $stdoutPath = Join-Path $env:RUNNER_TEMP "dopamine-windows-game.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "dopamine-windows-game.stderr.log"
          $gameProcess = Start-Process -FilePath $exportedGame `
            -ArgumentList @("--verbose", "--headless", "--quit-after", "3") `
            -WorkingDirectory $extractedDirectory -Wait -PassThru `
            -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $launchExitCode = $gameProcess.ExitCode
          $launchOutput = @()
          foreach ($logPath in @($stdoutPath, $stderrPath)) {
            if (Test-Path -LiteralPath $logPath) { $launchOutput += Get-Content -LiteralPath $logPath }
          }
          $launchOutput | Write-Output
          if ($launchExitCode -ne 0) { throw "Exported Windows game failed with exit code ${launchExitCode}: $exportedGame" }
          if ($launchOutput -match "GDExtension.*(not found|failed|unavailable)|Cannot get class 'CombatSimulation'") {
            throw "Exported game did not load its GDExtension"
          }

      - name: Run native simulation tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Debug --output-on-failure -R "^simulation_(core|worker)$"

      - name: Upload runnable Godot project
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-survivor-windows-x86_64
          path: |
            build/windows/export/**
